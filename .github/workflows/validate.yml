# Pool / security-review consistency + unit tests.
# Note: until this file exists on the default branch, GitHub may not register the
# workflow in the Actions UI / statusCheckRollup for PRs that only add it on the
# head branch. Local `unittest` + `validate_pool_security.py` are required gates
# regardless; do not treat absent checks as green CI.
name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Pool/security consistency (grandfather inventory)
        run: |
          set -euo pipefail
          # Do NOT pass origin/main as a legacy trust base (push-to-main would
          # self-baseline). Grandfather inventory is authoritative.
          python scripts/validate_pool_security.py
          # Diagnostic only: demonstrate self-baseline is ignored if supplied.
          python scripts/validate_pool_security.py --base-ref HEAD
