# Issue 收件箱：白名单作者开 [inbox] Issue → triage → candidate / graveyard / needs_human
name: inbox-triage

on:
  issues:
    # Do NOT listen to `opened`: creating an issue with the inbox label fires both
    # `opened` and `labeled`, which previously ran triage twice and double-commented.
    # `labeled` (inbox) covers create-with-label and add-label-later; `reopened` for retry.
    types: [labeled, reopened]

permissions:
  contents: write
  issues: write

# Serialize inbox commits to main so concurrent issues don't race-lose pushes.
concurrency:
  group: design-for-you-inbox-main
  cancel-in-progress: false

jobs:
  triage:
    if: >
      contains(join(github.event.issue.labels.*.name, ','), 'inbox')
      && (
        github.event.action != 'labeled'
        || github.event.label.name == 'inbox'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check allowlist
        id: allow
        env:
          ACTOR: ${{ github.event.issue.user.login }}
          EXTRA: ${{ vars.INBOX_ALLOWLIST || secrets.INBOX_ALLOWLIST }}
        run: |
          set -euo pipefail
          ALLOW="Bububuger"
          if [ -n "${EXTRA:-}" ]; then
            ALLOW="${ALLOW},${EXTRA}"
          fi
          IFS=',' read -ra PARTS <<< "$ALLOW"
          ok=0
          for p in "${PARTS[@]}"; do
            p="$(echo "$p" | xargs)"
            if [ "$p" = "$ACTOR" ]; then ok=1; break; fi
          done
          echo "actor=$ACTOR" >> "$GITHUB_OUTPUT"
          echo "allowed=$ok" >> "$GITHUB_OUTPUT"
          echo "Allowlist check: actor=$ACTOR allowed=$ok"

      - name: Reject non-allowlisted
        if: steps.allow.outputs.allowed != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body: '🚫 非白名单作者。本仓 inbox 仅接受维护者 / 授权 Bot 投喂。已关闭。'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              state: 'closed',
              state_reason: 'not_planned'
            });

      - name: Checkout
        if: steps.allow.outputs.allowed == '1'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.allow.outputs.allowed == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        if: steps.allow.outputs.allowed == '1'
        run: pip install -r requirements.txt

      - name: Skip if already triaged (idempotent)
        if: steps.allow.outputs.allowed == '1'
        id: dedup
        uses: actions/github-script@v7
        with:
          script: |
            // Prevent concurrent duplicate pushes/comments if two events still race.
            const markers = ['✅ 已入', '⏭️ 重复', '🚫', '🛡️ **pending_security_review**', '👀 **needs_human**', '⚠️ **非法 kind**'];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              per_page: 100,
            });
            const bot = comments.find(c => {
              const login = (c.user && c.user.login) || '';
              if (login !== 'github-actions[bot]' && login !== 'design-for-you-bot') return false;
              const body = c.body || '';
              return markers.some(m => body.includes(m));
            });
            if (bot) {
              core.info('Skip: triage conclusion comment already present');
              core.setOutput('skip', '1');
            } else {
              core.setOutput('skip', '0');
            }

      - name: Run triage
        if: steps.allow.outputs.allowed == '1' && steps.dedup.outputs.skip != '1'
        id: triage
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/triage.py inbox | tee /tmp/triage-comment.txt
          test -f /tmp/triage-result.json

      - name: Commit pool changes
        if: steps.allow.outputs.allowed == '1' && steps.dedup.outputs.skip != '1'
        run: |
          set -euo pipefail
          git config user.name "design-for-you-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites.yaml videos.yaml skills.yaml graveyard.yaml STATUS.md security-reviews || true
          if git diff --cached --quiet; then
            echo "No config changes to commit"
          else
            git commit -m "chore(inbox): triage #${{ github.event.issue.number }}"
            for attempt in 1 2 3 4 5; do
              if ! git pull --rebase origin main; then
                echo "::error::git pull --rebase failed (attempt ${attempt})"
                git rebase --abort 2>/dev/null || true
                if [ "${attempt}" -eq 5 ]; then
                  exit 1
                fi
                sleep $((attempt * 3))
                continue
              fi
              if git push origin HEAD:main; then
                echo "Pushed on attempt ${attempt}"
                exit 0
              fi
              echo "Push attempt ${attempt} failed; retrying..."
              sleep $((attempt * 3))
            done
            echo "::error::git push failed after retries"
            exit 1
          fi

      - name: Comment and close
        if: steps.allow.outputs.allowed == '1' && steps.dedup.outputs.skip != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'triage finished';
            try {
              const result = JSON.parse(fs.readFileSync('/tmp/triage-result.json', 'utf8'));
              body = result.comment || JSON.stringify(result, null, 2);
            } catch (e) {
              try {
                body = fs.readFileSync('/tmp/triage-comment.txt', 'utf8');
              } catch (_) {}
            }
            // Never leave feeder placeholders like "PR #None" in the bot comment.
            body = String(body).replace(/\bPR\s*#\s*(?:None|null|nil)\b/gi, '').replace(/[ \t]{2,}/g, ' ').trim();
            const issue = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue,
              body
            });
            // needs_human: leave open for maintainer; others close
            let decision = '';
            try {
              decision = JSON.parse(fs.readFileSync('/tmp/triage-result.json', 'utf8')).decision || '';
            } catch (_) {}
            if (decision !== 'needs_human') {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue,
                state: 'closed',
                state_reason: 'completed'
              });
            }
