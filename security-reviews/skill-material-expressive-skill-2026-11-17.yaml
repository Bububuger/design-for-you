findings:
  - id: F1
    severity: note
    category: network-exfiltration
    judgment: clean
    summary: >-
      No network calls anywhere in the repo. Grep for curl/wget/fetch/urllib/
      requests/socket/subprocess/os.system found only urllib.parse (urlsplit/
      unquote) in scripts/validate_skill.py, used solely to parse local Markdown
      links. All http(s) URLs in the repo are documentation links
      (m3.material.io, developer.android.com, w3.org, research.google,
      agentskills.io, youtu.be, img.shields.io badges); none is fetched by any
      code.
  - id: F2
    severity: note
    category: code-execution
    judgment: clean
    summary: >-
      The only executable code is scripts/validate_skill.py (stdlib-only:
      argparse, re, sys, pathlib, urllib.parse) plus its unittest file. No
      eval/exec/base64/__import__/shell invocation. The validator reads SKILL.md
      frontmatter and checks local Markdown links, with an explicit
      _is_inside_root() guard (Path.relative_to) that flags any reference
      escaping the skill directory. It was read, not executed.
  - id: F3
    severity: note
    category: credential-access
    judgment: clean
    summary: >-
      No credential or secret access. No reads of ~/.ssh, ~/.aws, .env, keychain,
      MCP config, or environment secrets. The only '.env'/'secrets' hits are
      lines in the stock Python .gitignore template (.env, .envrc,
      .streamlit/secrets.toml as ignore entries) and a CONTRIBUTING.md checklist
      line ('No generated files, secrets, personal data...'). No
      api-key/token/secret/password handling in code; 'token' hits are all
      Material design-token terminology.
  - id: F4
    severity: note
    category: prompt-injection
    judgment: clean
    summary: >-
      No prompt-injection or host-policy-override language. Grep for 'ignore
      previous/disregard/override/system prompt/jailbreak/bypass' found a single
      benign hit: 'Avoid one-off literals that bypass the theme' (design-token
      guidance). SKILL.md is conservative throughout: 'Do not invent APIs',
      'Do not report checks that were not run', 'Preserve the codebase',
      'Never claim full Material 3 Expressive parity where the platform does
      not provide it'.
  - id: F5
    severity: low
    category: supply-chain
    judgment: pass-with-note
    summary: >-
      No auto-execution surface: no hooks directory, no plugin.json/
      marketplace.json, no package.json, no shell scripts. The skill is
      Markdown guidance plus an opt-in, dependency-free validator. GitHub
      Actions workflow pins actions/checkout@v4 and actions/setup-python@v5 with
      minimal permissions (contents: read). README install path ('npx skills add
      asimawdah/material-expressive-skill' and manual git clone into ~/.codex/
      ~/.claude skills dirs) is standard Agent Skills installation; the npx
      route downloads the Skills CLI from npm, which is outside this repository
      review.
  - id: F6
    severity: note
    category: license-and-identity
    judgment: clean
    summary: >-
      MIT License present (Copyright (c) 2026 Asim Awdah), consistent with
      SKILL.md frontmatter 'license: MIT' and README badge. Author is GitHub
      user asimawdah; commit ed134a1966351de013b2652353bbbb20d9d3962a is signed
      'Asim Awdah <asimawdah.developer@gmail.com>' (2026-11-16). SKILL.md
      frontmatter name 'material-expressive-skill' matches the repository
      directory name, version 0.1.0.
  - id: F7
    severity: note
    category: binary-and-asset
    judgment: clean
    summary: >-
      Two binary/static assets: assets/expressive_icon.svg (2,749 B) is a plain
      static SVG (rect/path shapes only; grep for script/onload/onclick/onerror/
      javascript/foreignObject found nothing) and
      assets/Introducing-Material-3-Expressive.jpg (142,710 B, 1280x720 JPEG,
      JFIF). Neither is referenced by any executable code.
  - id: F8
    severity: low
    category: hygiene
    judgment: noted
    summary: >-
      No SECURITY.md in the repository. Single-maintainer project (asimawdah);
      no independent reputation check of the author was performed as part of
      this static review. Neither point is a security defect in the reviewed
      content, but both are recorded for the gate.
