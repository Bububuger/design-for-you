findings:
  - id: F1
    severity: note
    category: local_renderer_process_execution
    judgment: benign_local_only
    summary: >-
      adapters/headless/render.mjs is a user-invoked local renderer: it reads
      a scene JS file and CSS given on the command line, injects them into
      player.html, screenshots frames in Playwright Chromium, and pipes them
      to a locally spawned ffmpeg (spawn from node:child_process, binary
      path overridable via --ffmpeg). It reads only the CHROMIUM_PATH env
      var. The scene file is executed in the browser page by design, so a
      malicious --scene argument would run in Chromium; the bundled
      templates/scene-dialog.js itself only builds SVG (createElementNS,
      textContent) and contains no network, credential, or filesystem access.
      No network exfiltration, no credential reads, no reads outside the
      paths the user passes in.
  - id: F2
    severity: note
    category: install_time_download
    judgment: standard_dependency_download
    summary: >-
      adapters/headless/package.json (private: true, single dependency
      playwright ^1.47.0, MIT) has a postinstall script "playwright install
      chromium" that downloads a Chromium binary from Playwright's CDN at
      npm install time. Standard Playwright behaviour, but it is a network
      download triggered by install; the adapter is optional (the primary
      target is the Claude Motion artifact) and was not installed here.
  - id: F3
    severity: note
    category: external_font_fetch
    judgment: benign_documented_fallback
    summary: >-
      The two example sheets and player.html load Arimo from
      fonts.googleapis.com via a stylesheet link (plus preconnect in the
      examples). This is a fetch to Google Fonts when the HTML is opened;
      render.mjs documents that offline it falls back to Helvetica/Arial
      with the same metrics, and the drawing does not depend on the fetch.
      No other external URL is fetched by any file.
  - id: F4
    severity: note
    category: inline_html_js
    judgment: benign_self_contained
    summary: >-
      examples/card-sheet.html and dialog-sheet.html are self-contained
      single-file drawings with inline JS that builds SVG via
      createElementNS and sets textContent; the only innerHTML use in the
      repo is player.html's kit.h helper, applied to the scene author's own
      template strings, not to untrusted input. No fetch/XHR/WebSocket,
      no eval/Function, no base64 decode, no cookie/localStorage access.
  - id: F5
    severity: note
    category: provenance_license
    judgment: accept_with_attribution
    summary: >-
      MIT License, Copyright (c) 2026 Enes Ozturk. Named author with email
      in the git history (Enes Ozturk <enesozturk.d@gmail.com>). Repo is a
      single commit (2026-10-23); no SECURITY.md, no hooks, no plugin or
      marketplace manifest, no MCP configuration, no test files. Two skills:
      dimensional-drawing (drawing) and dimensional-drawing-motion
      (animation). No prompt-injection or safeguard-override language found
      in either SKILL.md.
  - id: F6
    severity: note
    category: keyword_scan
    judgment: no_malicious_pattern_found
    summary: >-
      Repo-wide scan found no curl/wget/fetch to unknown domains, no
      credential or secret paths (~/.ssh, ~/.aws, .env files, keychain, MCP
      configs), no eval/base64-decode patterns, no shell-outside the
      ffmpeg/Chromium renderer, and no authority-override or jailbreak
      language. The string ".env" in CSS/HTML is a class name for the
      shadow-envelope element, not environment-file access.
