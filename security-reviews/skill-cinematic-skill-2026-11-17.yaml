findings:
  - id: F1
    severity: note
    category: credential-access
    judgment: clean
    summary: >-
      No credential access anywhere: full-repo grep finds no reads of ~/.ssh,
      ~/.aws, .env, keychain, MCP config files, or API keys/tokens/passwords,
      and no environment-secret handling.
  - id: F2
    severity: note
    category: network-egress
    judgment: clean
    summary: >-
      Network egress is limited to well-known public hosts:
      commons.wikimedia.org (fetch_commons.py API + image URLs from API
      responses), raw.githubusercontent.com/google/fonts (get_fonts.py, two
      pinned font files), cdn.jsdelivr.net/npm (make_map.py default atlas
      sources). No telemetry, no unknown domains, no exfiltration channel.
  - id: F3
    severity: low
    category: command-execution
    judgment: noted-by-design
    summary: >-
      tts_say.py:76 runs the user-supplied --cmd TTS command with shell=True.
      Only reachable when the operator explicitly passes --cmd (documented); a
      malicious --cmd string would execute, but that input is operator-controlled,
      not remote.
  - id: F4
    severity: low
    category: code-execution-trust-boundary
    judgment: noted-by-design
    summary: >-
      render.py load_scene() executes the project's own scene.py via importlib
      exec_module. By design (scene.py is user-authored film code), but
      rendering a project obtained from an untrusted source executes its code;
      only render trusted projects.
  - id: F5
    severity: low
    category: supply-chain-installer
    judgment: noted
    summary: >-
      install.sh is a curl|bash installer (documented in README) that clones
      --depth 1 from main with no commit pin and updates via git pull --ff-only;
      it writes only ~/.cinematic-skill and symlinks into agent skill dirs, with
      no sudo or privilege escalation. Installing pulls latest main, not the
      pinned reviewed commit.
  - id: F6
    severity: low
    category: integrity-verification
    judgment: noted
    summary: >-
      get_fonts.py downloads two TTFs from raw.githubusercontent.com/google/fonts
      with no checksum or signature verification; a compromised or MITM'd
      response would land unverified font bytes in the project.
  - id: F7
    severity: low
    category: user-supplied-url
    judgment: noted-by-design
    summary: >-
      fetch_commons.py 'url' photo entries and make_map.py 'source' fields
      download arbitrary URLs taken from the project's own photos.json / map.json
      with no allowlist; licence for 'url' entries is self-declared by the
      project author and not verified. Both are operator-supplied project
      config, not remote input.
  - id: F8
    severity: note
    category: prompt-injection
    judgment: clean
    summary: >-
      No prompt-injection or policy-override language found in SKILL.md,
      references, scripts, or docs (no 'ignore previous instructions' /
      override / jailbreak wording). SKILL.md workflow includes four explicit
      user-approval gates (beat table, look, 30s draft, final voice).
  - id: F9
    severity: note
    category: provenance-license
    judgment: noted
    summary: >-
      MIT License present (Copyright (c) 2026 exploraX). Author is a pseudonymous
      single maintainer: GitHub Moh4696, self-identified as exploraX, X
      @exploraX_; repo first released 2026-11-09 (8 days old at review). No
      SECURITY.md. No package.json (Python-only skill; CI installs yaml@2.6.1
      ephemerally for tests only). Manifests agree on name cinematic-skill and
      version 1.0.1.
  - id: F10
    severity: note
    category: plugin-surface
    judgment: clean
    summary: >-
      No hooks, no MCP servers, no background services in any manifest
      (.claude-plugin/marketplace.json, .codex-plugin/plugin.json,
      .cursor-plugin/plugin.json, .agents/plugins/marketplace.json,
      gemini-extension.json, agents/openai.yaml). Plugin surface is the skill
      files plus the installer only.
unverified:
  - Runtime behaviour not tested: no script was executed, nothing installed, no film rendered
  - engine.py (1566 lines) was pattern-scanned (network, subprocess, file writes, eval/base64/pickle) but not read line by line
  - Author identity beyond the persistent pseudonym (GitHub Moh4696 / exploraX / X @exploraX_) was not independently verified
  - Upstream bytes (fonts, atlas JSON, Commons images) were not fetched or checksum-verified during this review
  - CI workflow (.github/workflows/check.yml) was read but not run
  - Future mutations of the upstream repository after the pinned commit
