findings:
  - id: F1
    severity: note
    category: local-command-execution
    judgment: benign-by-design
    summary: >-
      scripts/capture.ts spawns a local headless Chrome with a remote-debugging
      port on 127.0.0.1 (random port 9400-9799, --user-data-dir inside the output
      dir) and drives it over CDP, including Runtime.evaluate of setupJs/frameJs
      supplied as operator CLI arguments. It locates Chrome via $CHROME or the
      Playwright cache under $HOME only. No remote host, no exfiltration, no
      credential access; the evaluated JS comes only from the operator invoking
      the script.
  - id: F2
    severity: note
    category: local-command-execution
    judgment: benign
    summary: >-
      scripts/clip.ts runs ffmpeg via execFileSync with an argument array (no
      shell). Arguments are operator-supplied CLI values for a local
      clip-measurement tool.
  - id: F3
    severity: note
    category: local-command-execution
    judgment: benign
    summary: >-
      scripts/frames.sh invokes ffmpeg once with operator-supplied numeric
      crop/scale arguments interpolated into a filter string passed as a single
      argument; no shell eval of user content.
  - id: F4
    severity: note
    category: debug-surface
    judgment: benign
    summary: >-
      lib/ink.ts run() exposes window.__step only when the page is loaded with
      ?debug, for exact frame stepping during verification/capture. No network
      involvement.
  - id: F5
    severity: note
    category: dom-injection
    judgment: benign
    summary: >-
      examples/village/main.ts sets clock.innerHTML with only computed numeric
      time values (hours/minutes); no user or external input flows into it. No
      other innerHTML/document.write/insertAdjacentHTML in the repo.
  - id: F6
    severity: note
    category: documentation-only-reference
    judgment: benign
    summary: >-
      references/matching.md documents an X syndication endpoint URL template
      with the token shown as <redacted>; documentation only, no real token
      present and no code fetches that endpoint.
  - id: F7
    severity: low
    category: provenance
    judgment: noted
    summary: >-
      Single-commit repository (1 commit, 2026-11-10) by a single pseudonymous
      author JDhruv14 (GitHub noreply email); no SECURITY.md, no
      plugin.json/marketplace.json, no hooks. MIT LICENSE present (Copyright
      (c) 2026 JDhruv14). Pseudonymity is normal for GitHub and no suspicious
      content was found, so this is noted rather than blocking.
  - id: F8
    severity: note
    category: network-and-credentials
    judgment: clean
    summary: >-
      No curl/wget, no remote fetch/WebSocket except the localhost CDP fetch in
      capture.ts, no reads of ~/.ssh, ~/.aws, .env, keychain or MCP config, no
      eval/Function, no base64 obfuscation, no prompt-injection or
      policy-override wording. lib/ is dependency-free; package.json declares
      only 3 devDependencies (typescript, vite, @types/node) with a lockfile
      carrying npm registry sha512 integrity hashes; no install/postinstall
      scripts.
