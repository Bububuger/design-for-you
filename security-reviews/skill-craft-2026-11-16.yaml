findings:
  - id: F1
    severity: note
    category: session_start_hook
    judgment: consistent_with_stated_purpose
    summary: >-
      hooks/hooks.json registers a SessionStart hook whose script reads only
      the plugin's own skills/using-craft/SKILL.md and emits it as additional
      session context (pattern adapted from obra/superpowers, MIT, attributed
      in-file). No network calls, no reads outside the plugin root, no writes.
      A SessionStart hook is shell execution at install-and-run time by
      design of the plugin format; admission covers the pinned snapshot
      only and grants no execution permission.
  - id: F2
    severity: note
    category: maintainer_tooling_local_only
    judgment: benign_local_only
    summary: >-
      scripts/check.mjs / checks.mjs are local structure validators for
      contributors. scripts/check-privacy.mjs is the author's pre-push gate:
      it reads user-configured local files (env CRAFT_DENYLIST,
      CRAFT_PRIVATE_TOKENS) and prints colour/name collisions only; no
      network, and it is not wired into install or hooks. test/hook.test.mjs
      spawns bash only to exercise the hook in tests.
  - id: F3
    severity: note
    category: assertive_workflow_language
    judgment: scoped_to_own_domain_not_safeguard_override
    summary: >-
      using-craft SKILL.md uses emphatic routing language (EXTREMELY-IMPORTANT,
      'not optional') steering the agent to invoke craft's design skills
      before design work. The steering is scoped to the plugin's own design
      domain and its own approval stops; no claim to override host/system
      safeguards was found. Content remains untrusted data after approval.
  - id: F4
    severity: note
    category: provenance_license
    judgment: accept_with_attribution
    summary: >-
      MIT License (Copyright (c) 2026 Diego Fernandes). Hook files carry
      in-file attribution to obra/superpowers (MIT). Package is a design
      skill suite: 7 task skills plus the using-craft entry skill.
  - id: F5
    severity: note
    category: keyword_scan
    judgment: no_malicious_pattern_found
    summary: >-
      Repo-wide heuristic scan found no exfiltration endpoints, no
      credential/ssh/aws path access, no base64-decode or eval patterns,
      and no authority-override or jailbreak language.
unverified:
