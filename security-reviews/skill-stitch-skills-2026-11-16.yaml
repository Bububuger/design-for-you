notes: >-
  Fed from the GitHub Hot routine (2026-11-16 issue, new entry
  google-labs-code/stitch-skills) as a design/UI-generation skill collection
  for the skill track. Serious unresolved malicious findings were not
  established under static review. Residual risks (medium: agent-directed
  local-config API-key scraping and configurable --api-url destination;
  mutable upstream) are documented with a usage restriction forbidding
  agent config scanning; actual agent verification remains not_tested.
usage_restrictions:
  - Do not let the agent scan ~/.claude.json, ~/.gemini/settings.json,
    mcp_config.json, or other local MCP/config files for API keys.
  - Supply Stitch credentials only via explicit --api-key / environment
    after operator confirmation of the destination --api-url.
