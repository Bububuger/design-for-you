findings:
  - id: F1
    severity: note
    category: fetch_helper_scripts
    judgment: consistent_with_stated_purpose
    summary: >-
      fetch-stitch.sh / download-stitch-asset.sh / extract_inline_html.ts
      download caller-supplied URLs (Stitch signed export URLs, Google Cloud
      Storage asset URLs) to caller-supplied local paths via curl / node
      https. No hardcoded third-party endpoints and no credential handling
      in these scripts; URL expiry and TLS behaviour are surfaced as errors.
  - id: F2
    severity: note
    category: api_key_transit
    judgment: consistent_with_official_api_pattern
    summary: >-
      upload_to_stitch.py sends the Stitch API key only to the configured
      Stitch API base URL (default https://stitch.googleapis.com) in the
      X-Goog-Api-Key header, matching the official Stitch API pattern. No
      other network destination appears in the script.
  - id: F3
    severity: low
    category: credential_access_pattern
    judgment: residual_risk_documented_not_blocking
    summary: >-
      upload-to-stitch SKILL.md instructs the agent to locate the user's
      active MCP server configuration file and extract the Stitch API key
      from it, falling back to asking the user. This is the skill's stated
      function and, per F2, the key transits only to Google's endpoint; but
      operators should prefer supplying the key via the --api-key flag or
      environment rather than agent scraping of config files. This
      admission grants no credential access.
  - id: F4
    severity: note
    category: local_validation_scripts
    judgment: benign_local_only
    summary: >-
      validate.js performs local AST checks on component files via
      @swc/core; verify-setup.sh only checks local project config presence
      (components.json, tailwind config, tsconfig aliases). No network.
  - id: F5
    severity: note
    category: provenance_license
    judgment: accept_with_attribution
    summary: >-
      Apache License 2.0, Copyright Google LLC; the repo ships a SECURITY.md.
      Package is Google Labs' official Stitch skill collection: 16 skills
      across the stitch-build and stitch-design plugins.
